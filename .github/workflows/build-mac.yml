name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Pushing a tag like v0.16 builds AND publishes a GitHub Release, which
    # is what the in-app updater (app/updater.py) downloads from.
    tags: ["v*"]
    paths:
      - "app/**"
      - "assets/**"
      - "Sample Scripts/**"
      - "main.py"
      - "requirements.txt"
      - "ScriptLiner_mac.spec"
      - ".github/workflows/build-mac.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_V=$(python3 -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('app/version.py').read()).group(1))")
          if [ "v$APP_V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match APP_VERSION $APP_V in app/version.py"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .icns from the existing PNG logo
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/ScriptLinerLogo_Square.png --out icon.iconset/icon_512x512.png
          cp assets/ScriptLinerLogo_Square.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o assets/ScriptLinerLogo_Square.icns

      - name: Build the .app with PyInstaller
        run: pyinstaller ScriptLiner_mac.spec --noconfirm

      - name: Check the certificate bundle made it into the app
        run: |
          find dist/ScriptLiner.app -name cacert.pem | grep -q . || { echo "certifi's cacert.pem is missing from the app"; exit 1; }

      - name: Smoke-test the packaged app's update check
        run: |
          OUT=$(dist/ScriptLiner.app/Contents/MacOS/ScriptLiner --check-update 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "update-check ok"

      - name: Package as a .dmg
        run: |
          hdiutil create -volname ScriptLiner -srcfolder dist/ScriptLiner.app -ov -format UDZO dist/ScriptLiner.dmg

      - name: Zip the app for in-app updates
        run: ditto -c -k --keepParent dist/ScriptLiner.app dist/ScriptLiner-macOS.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ScriptLiner.dmg dist/ScriptLiner-macOS.zip \
            --title "ScriptLiner ${GITHUB_REF_NAME#v}" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptLiner-macOS
          path: dist/ScriptLiner.dmg
